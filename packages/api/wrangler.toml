# Worker name must stay "agent-registry-api" — that's the live worker holding
# the api.basedagents.ai route, the cron trigger, and all wrangler secrets.
# (A stray "basedagents-api" worker from 2026-03-10 is an unused orphan.)
#
# TOML rather than wrangler.jsonc so the config parses under ANY wrangler
# version (the cloudflare/wrangler-action v3 default, 3.90.0, could not read
# wrangler.jsonc). CI still pins a current wrangler for deploy reliability.
name = "agent-registry-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# D1 Database binding (Cloudflare's edge SQLite)
[[d1_databases]]
binding = "DB"
database_name = "agent-registry"
database_id = "e8173f0d-7d4f-44c7-8abb-8871a8b56627"
migrations_dir = "migrations"

[vars]
POW_DIFFICULTY = "22"
CHALLENGE_TTL_SECONDS = "300"
AUTH_MAX_CLOCK_SKEW = "60"
ENVIRONMENT = "production"
REGISTRY_SIGNING_PUBLIC_KEY = "9827a77ffa3bbddff01444277707271838098f3e8f2d29a200054cc0bca308d0"
KEYRING_RP_ID = "basedagents.ai"
KEYRING_ORIGINS = "https://app.basedagents.ai"
KEYRING_CONSOLE_ORIGIN = "https://app.basedagents.ai"
# Stripe price ids are config, not secrets (STRIPE_SECRET_KEY /
# STRIPE_WEBHOOK_SECRET are wrangler secrets — see scripts/bootstrap-deploy.md).
# Billing endpoints answer 503 until the secrets are set.
STRIPE_PRICE_PRO_MONTHLY = ""
STRIPE_PRICE_PRO_YEARLY = ""
# House accounts: paid tasks they posted carry `sponsored: true` in GET /v1/tasks/settled
# (the platform paying for work, labeled as such). Agent ids are public; add the
# console owner id (ow_…) that posts house tasks from app.basedagents.ai too.
# Hans, BasedAgents Bounties, usura_marketing, and the console owner whose Keyring
# vault key is Hans's key (so its ow_ id shares Hans's public key).
HOUSE_ACCOUNT_IDS = "ag_Dr5oGSMrZZoPCDB7K8iutDCArp5UDCZpPNPYzxRf7yEV,ag_95W5FkDc57BFYwRNcLzwViRBAV4S7iepQMsH4pTcifbE,ag_8SFNAVuWkaEMUNpxHzRXec18M8FJsjLMWDNrj5bbbRCC,ow_Dr5oGSMrZZoPCDB7K8iutDCArp5UDCZpPNPYzxRf7yEV"
# Owner ids (ow_…) that see the console's operator pages (feedback triage).
# Feedback notifications go to the FEEDBACK_NOTIFY_EMAIL / FEEDBACK_SLACK_WEBHOOK_URL
# secrets (wrangler secret put …); with neither set, reports are stored silently.
ADMIN_OWNER_IDS = "ow_Dr5oGSMrZZoPCDB7K8iutDCArp5UDCZpPNPYzxRf7yEV"
# ─── Agent Testing (docs/AGENT_TESTING_RUNBOOK.md §3) ───
# Plain config, like the Keyring price ids above. Set values HERE and deploy —
# wrangler replaces the Worker's plain vars wholesale on every deploy, so a
# value typed into the Cloudflare dashboard would be clobbered by the next CI
# deploy. The one testing SECRET (TESTING_TREASURY_PRIVATE_KEY) goes through
# scripts/put-secrets.sh, never this file. All flags deliberately off.
# Product pages, intake and (test-mode) checkout are LIVE. Nothing is payable
# until the operator approves a quote, and quote approval is where capacity is
# confirmed (spec §1.4). Fulfillment stays off until the service agent +
# treasury exist (runbook §3.4–3.5).
TESTING_PRODUCT_ENABLED = "true"
TESTING_CHECKOUT_ENABLED = "true"
TESTING_FULFILLMENT_ENABLED = "false"
TESTING_PRODUCT_LIVE_APPROVED = "false"
# Sandbox (test-mode) one-time $200 price — recreate + replace when moving
# to live keys.
STRIPE_PRICE_TESTING_AUDIT = "price_1UK60jEHXx0SqvxponhWkGg1"
TESTING_PLATFORM_AGENT_ID = "ag_58FCNp9N6FNdsMis845K4zHF1MC1D1p1ec6kF9VbsEQR"
TESTING_SUPPORT_EMAIL = ""
TESTING_OPERATOR_EMAIL = ""

# Custom domain route
[[routes]]
pattern = "api.basedagents.ai/*"
zone_name = "basedagents.ai"

# Cron triggers
[triggers]
crons = ["*/5 * * * *"]

# ─── Staging environment ──────────────────────────────────────────────────
# Deploy: npx wrangler deploy --env staging --name agent-registry-api-staging
# URL:    https://agent-registry-api-staging.<account>.workers.dev
#         (or api-staging.basedagents.ai once DNS is pointed)
#
# Named environments do NOT inherit top-level `routes`/`triggers` implicitly the
# way we want, so staging sets both to empty explicitly — it must never grab the
# production api.basedagents.ai route or the production cron.
[env.staging]
routes = []

[[env.staging.d1_databases]]
binding = "DB"
database_name = "agent-registry-staging"
database_id = "44894b71-4c29-48ca-b723-ee82c1d161e1"
migrations_dir = "migrations"

[env.staging.vars]
POW_DIFFICULTY = "4"
CHALLENGE_TTL_SECONDS = "300"
AUTH_MAX_CLOCK_SKEW = "60"
ENVIRONMENT = "staging"
# Bounties + escrow on staging (Base Sepolia dry runs). Still fail closed until the
# staging secrets exist: CDP_API_KEY_ID, CDP_API_KEY_SECRET, PAYMENT_ENCRYPTION_KEY
# (payments) and ESCROW_WALLET_PRIVATE_KEY (escrow) — see scripts/bootstrap-deploy.md §6–7.
TASK_PAYMENTS_ENABLED = "1"
# Agent Testing on staging: same shape as production above; rehearse the flag
# flips + test-mode Stripe price here first (runbook §7).
TESTING_PRODUCT_ENABLED = "false"
TESTING_CHECKOUT_ENABLED = "false"
TESTING_FULFILLMENT_ENABLED = "false"
TESTING_PRODUCT_LIVE_APPROVED = "false"
STRIPE_PRICE_TESTING_AUDIT = ""
TESTING_PLATFORM_AGENT_ID = ""
TESTING_SUPPORT_EMAIL = ""
TESTING_OPERATOR_EMAIL = ""

[env.staging.triggers]
crons = []
