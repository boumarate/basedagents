# Turns a pushed v* tag into a GitHub Release, so the /releases page tracks
# platform milestones instead of whatever tag happened to be pushed last.
# Notes come from docs/releases/<tag>.md checked in alongside the tag; when
# the file is missing, GitHub's generated notes are used. Re-pushing a tag
# whose release exists updates the title/notes instead of failing, so the
# workflow is safe to re-run.
name: Release

on:
  push:
    tags: ['v*']
  # Some remotes (e.g. proxied pushes) only carry branch refs. Dispatching
  # with a tag name makes the runner create the annotated tag at the
  # dispatched ref's HEAD itself, then publish the release — one path for
  # both worlds. GITHUB_TOKEN tag pushes do not re-trigger this workflow.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create (at this ref) and release, e.g. v0.9.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure the tag exists (dispatch only)
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          case "$TAG" in v*) ;; *) echo "tag must start with v"; exit 1;; esac
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "tag $TAG already exists on origin"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "BasedAgents ${TAG#v} — notes: docs/releases/$TAG.md"
            git push origin "refs/tags/$TAG"
          fi
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          TITLE="BasedAgents ${TAG#v}"
          NOTES="docs/releases/${TAG}.md"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ -f "$NOTES" ]; then
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes-file "$NOTES" --latest
            else
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --latest
            fi
          elif [ -f "$NOTES" ]; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes-file "$NOTES" --latest --verify-tag
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --generate-notes --latest --verify-tag
          fi
