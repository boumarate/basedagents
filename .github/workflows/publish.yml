# Publish the public packages with trusted publishing (OIDC): no npm or PyPI
# token is stored anywhere. Each job asks the registry whether the version in
# the checked-in manifest is already published and skips when it is, so the
# workflow is safe to run at any time — it only ever ships a version bump.
#
# Runs after CI finishes on main (a push, or a manual CI re-run), and only when
# CI passed: a commit whose tests fail never reaches a registry. The gate job checks that, then asks
# each registry which versions are unpublished, so the publish jobs only run
# when there is a bump to ship. Manual dispatch (re-run a failed publish) also
# requires a green CI run on the dispatched commit.
#
# One-time setup per registry (documented in GOTCHAS.md → Releasing):
#   npmjs.com  → each package → Settings → Trusted Publisher → GitHub Actions
#                owner maxfain, repo basedagents, workflow publish.yml,
#                environment "publish".
#   pypi.org   → project basedagents → Publishing → add a GitHub publisher
#                with the same owner/repo/workflow and environment "publish".
#
# The npm jobs are independent and run in parallel. The MCP Registry listing
# (server.json) publishes after the npm package it points at, and needs no
# setup: GitHub OIDC proves ownership of the io.github.maxfain/* namespace.

name: Publish

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    name: CI passed + what to publish
    # Only a successful CI run on main in this repository: a push, or a manual
    # re-run of CI after a cancelled or flaky one. Never a pull request,
    # including one from a fork's branch named main.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'push' ||
        github.event.workflow_run.event == 'workflow_dispatch') &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      sdk: ${{ steps.detect.outputs.sdk }}
      mcp: ${{ steps.detect.outputs.mcp }}
      registry: ${{ steps.detect.outputs.registry }}
      python: ${{ steps.detect.outputs.python }}
    steps:
      - name: Commit to publish
        id: sha
        env:
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: echo "sha=${RUN_SHA:-$GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: CI passed on this commit (manual runs)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          n=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&branch=main&status=success" \
            --jq "[.workflow_runs[] | select(.event == \"push\" or .event == \"workflow_dispatch\") | select(.head_repository.full_name == \"${GITHUB_REPOSITORY}\")] | length")
          if [ "$n" = "0" ]; then echo "::error::CI has not passed on ${SHA}; not publishing"; exit 1; fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.sha.outputs.sha }}
      - name: Which versions are unpublished
        id: detect
        run: |
          set -euo pipefail
          # true when the checked-in version isn't on the registry yet (a lookup
          # error also says true: the job re-checks before publishing anything).
          npm_unpublished() {
            local name version
            name=$(jq -r .name "$1/package.json"); version=$(jq -r .version "$1/package.json")
            if npm view "${name}@${version}" version >/dev/null 2>&1; then echo false; else echo true; fi
          }
          {
            echo "sdk=$(npm_unpublished packages/sdk)"
            echo "mcp=$(npm_unpublished packages/mcp)"
            name=$(jq -r .name packages/mcp/server.json); version=$(jq -r .version packages/mcp/server.json)
            listed=$(curl -sS "https://registry.modelcontextprotocol.io/v0/servers?search=${name}" \
              | jq -r --arg n "$name" --arg v "$version" '[.servers[] | (.server // .) | select(.name == $n and .version == $v)] | length' || echo 0)
            echo "registry=$([ "$listed" = "0" ] && echo true || echo false)"
            pyver=$(python3 -c "import tomllib; print(tomllib.load(open('packages/python/pyproject.toml','rb'))['project']['version'])")
            echo "python=$(curl -sSf -o /dev/null "https://pypi.org/pypi/basedagents/${pyver}/json" && echo false || echo true)"
          } | tee -a "$GITHUB_OUTPUT"

  sdk:
    name: npm basedagents (sdk + cli)
    needs: gate
    if: needs.gate.outputs.sdk == 'true' 
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@latest && npm --version
      - run: npm ci
      - name: Publish if unpublished
        run: scripts/publish-if-unpublished.sh packages/sdk

  mcp:
    name: npm @basedagents/mcp
    needs: gate
    if: needs.gate.outputs.mcp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@latest && npm --version
      - run: npm ci
      - name: Publish if unpublished
        run: scripts/publish-if-unpublished.sh packages/mcp

  # The official MCP Registry (registry.modelcontextprotocol.io) lists what
  # packages/mcp/server.json says — its description comes from positioning.
  # It was only ever published by hand, so the listing sat at 0.3.1 with the
  # retired identity-registry copy while npm moved on.
  mcp-registry:
    name: MCP Registry listing
    needs: [gate, mcp]
    if: >-
      always() && needs.gate.result == 'success' && needs.gate.outputs.registry == 'true' &&
      (needs.mcp.result == 'success' || needs.mcp.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - name: Skip if this version is already listed
        id: check
        run: |
          name=$(jq -r .name packages/mcp/server.json); version=$(jq -r .version packages/mcp/server.json)
          listed=$(curl -sS "https://registry.modelcontextprotocol.io/v0/servers?search=${name}" \
            | jq -r --arg n "$name" --arg v "$version" '[.servers[] | (.server // .) | select(.name == $n and .version == $v)] | length')
          if [ "$listed" != "0" ]; then
            echo "${name} ${version} is already on the MCP Registry — nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publishing ${name} ${version} to the MCP Registry"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.publish == 'true'
        name: Publish server.json
        # Pinned + checksum-verified: this binary runs with id-token: write.
        # Bump both together from the release's registry_<version>_checksums.txt.
        env:
          PUBLISHER_VERSION: v1.8.1
          PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -sSLo mcp-publisher.tgz "https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${PUBLISHER_SHA256}  mcp-publisher.tgz" | sha256sum -c -
          tar xzf mcp-publisher.tgz mcp-publisher
          ./mcp-publisher login github-oidc
          cd packages/mcp && ../../mcp-publisher publish

  python:
    name: PyPI basedagents
    needs: gate
    if: needs.gate.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Skip if this version is already on PyPI
        id: check
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('packages/python/pyproject.toml','rb'))['project']['version'])")
          if curl -sSf -o /dev/null "https://pypi.org/pypi/basedagents/${version}/json"; then
            echo "basedagents ${version} is already on PyPI — nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publishing basedagents ${version}"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.publish == 'true'
        run: python3 -m pip install --upgrade build && python3 -m build packages/python
      - if: steps.check.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python/dist
