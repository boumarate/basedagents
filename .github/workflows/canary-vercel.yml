# Provisioner drift canary (spec §4): run the full Vercel recipe weekly against
# a dedicated test account, so UI drift is caught here — never by users. Fails
# file an issue with the failing step id.
#
# Requires repository secrets (skipped cleanly when absent):
#   VERCEL_CANARY_TOKEN — a provisioning-class token for the TEST account, used
#     to (a) seed the vault non-interactively and (b) verify + clean up minted
#     canary tokens. The browser half of the recipe needs a live session cookie,
#     which cannot ship as a CI secret safely — so the canary exercises the
#     bootstrap-then-API path from an existing provisioner (the every-connect
#     path) end-to-end, and the recipe's page contract via logged-out probes.
name: Canary — Vercel provisioner

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch: {}

# One run at a time, so a manual run that overlaps the scheduled one can't
# find no open issue at the same moment and file a second.
concurrency:
  group: canary-vercel
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build keyring
        run: npm run build:dist --workspace=packages/keyring

      - name: Check canary secret
        id: gate
        run: |
          if [ -n "${{ secrets.VERCEL_CANARY_TOKEN }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "VERCEL_CANARY_TOKEN not set — skipping live canary."
          fi

      - name: Live canary (API mint→verify→burn + page contract)
        if: steps.gate.outputs.run == 'true'
        env:
          VERCEL_CANARY_TOKEN: ${{ secrets.VERCEL_CANARY_TOKEN }}
        run: xvfb-run --auto-servernum node scripts/canary-vercel.mjs

      - name: File issue on failure
        if: failure() && steps.gate.outputs.run == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            // One open issue per canary: later failures comment on it instead
            // of opening a new issue every week.
            const { owner, repo } = context.repo;
            const prefix = 'Vercel provisioner canary failed';
            const date = new Date().toISOString().slice(0, 10);
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const open = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', labels: 'canary', per_page: 100 });
            const existing = open.find((i) => !i.pull_request && i.title.startsWith(prefix));
            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body: `Failed again on ${date}: ${runUrl}` });
            } else {
              await github.rest.issues.create({
                owner, repo,
                title: `${prefix} (${date})`,
                body: 'The weekly Vercel canary failed — likely dashboard/API drift. See the run: ' + runUrl +
                      '\n\nLater failures are added here as comments while this issue is open; it closes itself when the canary passes again.',
                labels: ['provisioner', 'canary'],
              });
            }

      - name: Close the open failure issue once the canary passes
        if: success() && steps.gate.outputs.run == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const prefix = 'Vercel provisioner canary failed';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const open = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', labels: 'canary', per_page: 100 });
            for (const issue of open.filter((i) => !i.pull_request && i.title.startsWith(prefix))) {
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: `The canary passed again: ${runUrl}` });
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed', state_reason: 'completed' });
            }
